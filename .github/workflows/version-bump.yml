name: Version Bump

# Camino alternativo al script local, para bumpear desde la UI de GitHub.
#
# Deliberadamente **termina en un PR**: no crea el tag. El tag es lo que dispara
# publish.yml, y crearlo acá lo pondría sobre la rama `bump-version` antes de que
# el PR se mergee — publicando código que nunca entró a `main`. (El job `tag` que
# había antes nunca corría: su condición `inputs.bump == ''` es imposible con un
# input requerido que tiene default.)
#
# El camino normal es el script local, que además corre typecheck y tests antes
# de tocar git:
#
#   bun run version:set 0.1.6 --push
#   bun run version:set 0.2.0-rc.1 --push --npm-tag=next
#
# Después de mergear el PR de acá, el tag se crea a mano:
#   git tag -a v0.1.6 -m "release v0.1.6 [npm-tag:latest]" && git push origin v0.1.6

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Type of bump (patch, minor, major)'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

jobs:
  bump:
    runs-on: ubuntu-latest
    outputs:
      new_version: ${{ steps.version.outputs.new_version }}
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Calculate new version
        id: version
        run: |
          current=$(node -p "require('./package.json').version")
          echo "Current version: $current"
          IFS='.' read -ra parts <<< "$current"
          major=${parts[0]}; minor=${parts[1]}; patch=${parts[2]}
          case "${{ github.event.inputs.bump }}" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
          esac
          new_version="$major.$minor.$patch"
          echo "New version: $new_version"
          echo "new_version=$new_version" >> $GITHUB_OUTPUT
          echo "tag=v$new_version" >> $GITHUB_OUTPUT

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Un bump que no compila o rompe tests no debería llegar ni al PR.
      - name: Type check
        run: bun run typecheck

      - name: Run tests
        run: bun test --timeout 30000

      # Mismo conjunto de archivos que scripts/bump-version.ts, para que los dos
      # caminos dejen el árbol igual.
      - name: Sync version
        run: bun scripts/bump-version.ts "${{ steps.version.outputs.new_version }}"

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore: bump version to ${{ steps.version.outputs.new_version }}"
          branch: bump-version
          delete-branch: true
          title: "Bump version to ${{ steps.version.outputs.new_version }}"
          body: |
            Version bump a ${{ steps.version.outputs.new_version }} en el paquete raíz y los workspaces.

            Este PR **no crea el tag**. Después de mergear:

            ```bash
            git tag -a ${{ steps.version.outputs.tag }} -m "release ${{ steps.version.outputs.tag }} [npm-tag:latest]"
            git push origin ${{ steps.version.outputs.tag }}
            ```

            Falta agregar la sección `## ${{ steps.version.outputs.new_version }}` al CHANGELOG.
          labels: version-bump
